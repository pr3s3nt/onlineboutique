apiVersion: score.dev/v1b1
metadata:
  name: product.catalog
  annotations:
    tags: "golang,backend,grpc"
containers:
  product.catalog:
    image: ghcr.io/pr3s3nt/onlineboutique.product.catalog:latest
    variables:
      DISABLE_PROFILER: "1"
      PORT: "3550"
    resources:
      limits:
        memory: "40Mi"
        cpu: "30m"
      requests:
        memory: "20Mi"
        cpu: "10m"
service:
  ports:
    grpc:
      port: 3550
      targetPort: 3550